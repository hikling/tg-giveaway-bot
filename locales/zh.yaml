# 仅简体中文界面。变量由消息格式化函数进行 HTML 转义。
start:
  welcome: '👋 欢迎使用古诗词抽奖机器人！

    点击抽奖帖的「参加」，在私聊中选择诗句缺少的两个字。每题限时60秒，超时计错。答对即可报名，每人每场最多答错五次。

    发送 /help 查看命令列表。'
  help: '📖 命令列表


    • /start — 欢迎

    • /help — 本帮助

    • /me — 我参与的抽奖

    • /result 〈抽奖编号〉 — 私聊查询中奖结果


    管理员命令 (仅管理员)

    • /newgiveaway — 创建新抽奖

    • /list — 全部进行中的抽奖

    • /cancel 〈抽奖编号〉 — 取消抽奖

    • /reroll 〈抽奖编号〉 〈奖项名〉 — 重抽已结束的奖项

    • /retry 〈抽奖编号〉 — 重试未送达的中奖私信

    • /reclaim 〈抽奖编号〉 — 主办方私聊取回逾期回收的独立码

    • /ban 〈用户编号〉 [原因] — 拉黑用户(同时清除其报名记录)

    • /unban 〈用户编号〉 — 解除拉黑

    • /addadmin 〈用户编号〉 — 添加管理员


    报名须答对古诗词选择题；累计错五次后不能参与本场抽奖。

    支持同时要求加入频道与群组，支持定时或满人数开奖。每题限时60秒，超时计错。

    /republish 〈抽奖编号〉 — 管理员补发未成功发布的抽奖帖。'

<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>抽奖管理</title>
    <link rel="stylesheet" href="/admin/assets/app.css">
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="/admin/assets/app.js" defer></script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand-row">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="8" width="18" height="4" rx="1.5"></rect>
                            <path d="M12 8v13"></path>
                            <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path>
                            <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path>
                        </svg>
                    </span>
                    <div class="brand-copy">
                        <h1>抽奖管理</h1>
                        <span class="brand-sub" id="tz-badge">古诗词防脚本抽奖</span>
                    </div>
                </div>
                <button type="button" id="theme-toggle" class="icon-button" aria-label="切换深浅色主题" title="切换深浅色主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                </button>
            </div>
            <nav id="navigation" class="navigation" aria-label="管理功能" hidden>
                <button type="button" data-page="list" aria-pressed="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 12v10H4V12"></path>
                        <path d="M2 7h20v5H2z"></path>
                        <path d="M12 22V7"></path>
                        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                        <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                    </svg>
                    <span>抽奖活动</span>
                </button>
                <button type="button" data-page="access" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span>权限与风控</span>
                </button>
            </nav>
        </header>

        <div id="notice" class="notice" role="status" aria-live="polite" hidden>
            <span class="notice-icon" aria-hidden="true"></span>
            <span class="notice-text"></span>
            <button type="button" class="notice-close" id="notice-close" aria-label="关闭提示">×</button>
        </div>

        <main id="content" aria-busy="true">
            <div class="panel skeleton-card">
                <div class="skeleton-line wide"></div>
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line short"></div>
            </div>
        </main>
    </div>

    <template id="create-template">
        <form id="create-form" autocomplete="off">
            <div class="section-heading">
                <h2 tabindex="-1">新建抽奖</h2>
            </div>

            <ol class="step-nav" aria-label="创建步骤">
                <li><a href="#step-basic" class="step-pill is-active" data-step="step-basic"><span>1</span>基本信息</a></li>
                <li><a href="#step-locations" class="step-pill" data-step="step-locations"><span>2</span>发布位置</a></li>
                <li><a href="#step-condition" class="step-pill" data-step="step-condition"><span>3</span>开奖条件</a></li>
                <li><a href="#step-prizes" class="step-pill" data-step="step-prizes"><span>4</span>奖项库存</a></li>
            </ol>

            <section id="step-basic" class="panel form-section">
                <div class="section-title-row">
                    <h3><span class="step-badge">1</span>基本信息</h3>
                    <span class="hint">展示在抽奖帖顶部</span>
                </div>
                <div class="field-group">
                    <div class="field-header">
                        <label for="create-title">抽奖标题</label>
                        <span class="counter" id="title-counter">0 / 256</span>
                    </div>
                    <input id="create-title" name="title" maxlength="256" placeholder="例如：周末福利 · Steam 礼品卡大放送" required>
                </div>
                <div class="field-group">
                    <div class="field-header">
                        <label for="create-description">抽奖说明 <span class="tag-optional">选填</span></label>
                        <span class="counter" id="desc-counter">0 / 4096</span>
                    </div>
                    <textarea id="create-description" name="description" maxlength="4096" rows="3" placeholder="补充活动规则、兑换有效期或赞助商说明…"></textarea>
                </div>
            </section>

            <section id="step-locations" class="panel form-section">
                <div class="section-title-row">
                    <h3><span class="step-badge">2</span>发布位置与报名条件</h3>
                    <span class="hint">单选或多选皆可</span>
                </div>
                <p class="hint" id="location-guide">支持只选 1 个频道或 1 个群组，也支持同时添加多个频道和群组（每行一处）；参与者须全部加入才能报名。</p>

                <div class="field-group">
                    <span class="field-label">发布范围</span>
                    <div class="segmented-radios three">
                        <label class="segmented-item">
                            <input type="radio" name="location_scope" value="both" checked>
                            <span>频道 + 群组</span>
                        </label>
                        <label class="segmented-item">
                            <input type="radio" name="location_scope" value="channels">
                            <span>仅频道</span>
                        </label>
                        <label class="segmented-item">
                            <input type="radio" name="location_scope" value="groups">
                            <span>仅群组</span>
                        </label>
                    </div>
                </div>

                <div id="channels-field" class="field-group">
                    <div class="field-header">
                        <label for="create-channels">必加频道</label>
                        <span class="hint">可填 1 个或多个（每行一处）</span>
                    </div>
                    <div id="channels-saved" class="saved-picks" hidden></div>
                    <textarea id="create-channels" name="channels" rows="2" placeholder="官方频道 | https://t.me/your_channel" aria-describedby="location-guide private-guide"></textarea>
                    <div class="parsed-chips" id="channels-preview"></div>
                </div>

                <div id="groups-field" class="field-group">
                    <div class="field-header">
                        <label for="create-groups">必加群组</label>
                        <span class="hint">可填 1 个或多个（每行一处）</span>
                    </div>
                    <div id="groups-saved" class="saved-picks" hidden></div>
                    <textarea id="create-groups" name="groups" rows="2" placeholder="交流群 | https://t.me/your_group&#10;私有群 | https://t.me/+invite | -1001234567890" aria-describedby="location-guide private-guide"></textarea>
                    <div class="parsed-chips" id="groups-preview"></div>
                </div>

                <details class="quick-builder" id="location-builder">
                    <summary class="button secondary compact">+ 手动添加一行位置</summary>
                    <div class="builder-body">
                        <div class="builder-grid">
                            <label>类型
                                <span class="select-wrap">
                                    <select id="builder-kind">
                                        <option value="channels">频道</option>
                                        <option value="groups">群组</option>
                                    </select>
                                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                                </span>
                            </label>
                            <label>显示名称
                                <input id="builder-name" type="text" maxlength="100" placeholder="例如：官方频道">
                            </label>
                        </div>
                        <div class="builder-grid">
                            <label>邀请链接或 @用户名
                                <input id="builder-url" type="text" placeholder="https://t.me/... 或 @name">
                            </label>
                            <label>私有编号 <span class="tag-optional">私有链接必填</span>
                                <input id="builder-chat-id" type="text" inputmode="text" placeholder="-1001234567890">
                            </label>
                        </div>
                        <div class="button-row">
                            <button type="button" class="button primary compact" id="builder-insert">添加到列表</button>
                            <span class="hint" id="builder-hint"></span>
                        </div>
                    </div>
                </details>

                <p id="private-guide" class="hint callout-hint">私有链接请使用 <code>名称 | https://t.me/+邀请码 | -100编号</code>，确保机器人已加入并拥有管理员权限。</p>
            </section>

            <section id="step-condition" class="panel form-section">
                <div class="section-title-row">
                    <h3><span class="step-badge">3</span>开奖条件</h3>
                    <span id="timezone" class="hint"></span>
                </div>

                <fieldset class="choice-fieldset">
                    <legend>开奖方式</legend>
                    <div class="choice-grid three">
                        <label class="choice-card">
                            <input type="radio" name="draw_mode" value="time" checked>
                            <span class="choice-body">
                                <strong>按时间开奖</strong>
                                <span class="hint">到达截止时间自动开奖</span>
                            </span>
                        </label>
                        <label class="choice-card">
                            <input type="radio" name="draw_mode" value="count">
                            <span class="choice-body">
                                <strong>满人数开奖</strong>
                                <span class="hint">有效报名达标立即开奖</span>
                            </span>
                        </label>
                        <label class="choice-card">
                            <input type="radio" name="draw_mode" value="either">
                            <span class="choice-body">
                                <strong>任一先到</strong>
                                <span class="hint">到时间或满人数先到为准</span>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <div id="time-mode-field" class="field-group">
                    <span class="field-label">时间设置方式</span>
                    <div class="segmented-radios">
                        <label class="segmented-item">
                            <input type="radio" name="time_mode" value="relative" checked>
                            <span>设定持续时长</span>
                        </label>
                        <label class="segmented-item">
                            <input type="radio" name="time_mode" value="absolute">
                            <span>指定日期与时间</span>
                        </label>
                    </div>
                </div>

                <div id="duration-field" class="stack-sm">
                    <div class="tier-fields">
                        <label>持续时长
                            <input type="number" name="duration" inputmode="numeric" min="1" max="1000000" step="1" value="1">
                        </label>
                        <label>单位
                            <span class="select-wrap">
                                <select name="duration_unit">
                                    <option value="m">分钟</option>
                                    <option value="h" selected>小时</option>
                                    <option value="d">天</option>
                                    <option value="w">周</option>
                                </select>
                                <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                            </span>
                        </label>
                    </div>
                </div>

                <div id="deadline-field" class="stack-sm" hidden>
                    <label>开奖时间
                        <input type="datetime-local" name="deadline" required>
                    </label>
                </div>

                <div id="target-field" class="stack-sm" hidden>
                    <label>有效报名目标人数
                        <input type="number" name="target" inputmode="numeric" min="1" max="1000000000" step="1" placeholder="例如：100">
                    </label>
                </div>
            </section>

            <section id="step-prizes" class="panel form-section">
                <div class="section-title-row">
                    <h3><span class="step-badge">4</span>奖项与发奖</h3>
                    <span class="hint" id="prize-summary-pill">共 1 档 · 1 名额</span>
                </div>

                <fieldset class="choice-fieldset">
                    <legend>发奖方式</legend>
                    <div class="choice-grid three">
                        <label class="choice-card">
                            <input type="radio" name="prize_mode" value="none" checked>
                            <span class="choice-body">
                                <strong>主办方联系</strong>
                                <span class="hint">开奖后由主办方私信发奖</span>
                            </span>
                        </label>
                        <label class="choice-card">
                            <input type="radio" name="prize_mode" value="unique">
                            <span class="choice-body">
                                <strong>独立码发奖</strong>
                                <span class="hint">一行一条，每人领取唯一内容</span>
                            </span>
                        </label>
                        <label class="choice-card">
                            <input type="radio" name="prize_mode" value="shared">
                            <span class="choice-body">
                                <strong>共享文本</strong>
                                <span class="hint">所有中奖者领取同一份文本</span>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <div id="tier-list" class="tier-list"></div>

                <div class="button-row">
                    <button type="button" class="button secondary" id="add-tier">＋ 添加奖项</button>
                    <button type="button" class="button quiet danger-text" id="reset-codes" hidden>清空全部奖品内容</button>
                </div>
            </section>

            <p class="form-error" id="create-error" role="alert" tabindex="-1" hidden></p>
            <div class="sticky-submit">
                <button type="submit" id="preview-button" class="button primary full">预览抽奖帖子并核对</button>
            </div>
        </form>
    </template>

    <template id="tier-template">
        <fieldset class="tier">
            <div class="tier-header">
                <legend>奖项</legend>
                <button type="button" class="button quiet compact remove-tier">移除</button>
            </div>
            <div class="tier-fields">
                <label>奖项名称 <input name="tier_name" maxlength="64" placeholder="例如：一等奖" required></label>
                <label>中奖人数 <input name="tier_count" type="number" value="1" inputmode="numeric" step="1" min="1" max="1000000000" required></label>
            </div>
            <div class="codes-field" hidden>
                <div class="field-header">
                    <label class="codes-label"><span></span></label>
                    <button type="button" class="link-btn clean-codes" hidden>去除空行与重复</button>
                </div>
                <textarea name="tier_codes" rows="3" spellcheck="false" placeholder="粘贴卡密或兑换码，每行一条…"></textarea>
            </div>
            <div class="tier-footer">
                <span class="status inventory-badge" hidden></span>
                <span class="hint inventory"></span>
            </div>
        </fieldset>
    </template>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
        <form method="dialog">
            <div class="dialog-header">
                <h2 id="confirm-title"></h2>
            </div>
            <p id="confirm-body" class="prewrap"></p>
            <div class="button-row dialog-actions">
                <button value="cancel" class="button secondary" autofocus>返回</button>
                <button value="confirm" class="button primary" id="confirm-action">确认</button>
            </div>
        </form>
    </dialog>
</body>
</html>

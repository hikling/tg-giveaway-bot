<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>抽奖管理</title>
    <link rel="stylesheet" href="/admin/assets/app.css">
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="/admin/assets/app.js" defer></script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <h1>抽奖管理</h1>
            </div>
            <nav id="navigation" class="navigation" aria-label="管理功能" hidden>
                <button type="button" data-page="list" aria-pressed="true">抽奖</button>
                <button type="button" data-page="access" aria-pressed="false">权限管理</button>
            </nav>
        </header>
        <div id="notice" class="notice" role="status"></div>
        <main id="content" aria-busy="true">
            <div class="panel empty">正在连接 Telegram…</div>
        </main>
    </div>

    <template id="create-template">
        <form id="create-form" autocomplete="off">
            <div class="section-heading">
                <h2 tabindex="-1">新建抽奖</h2>
            </div>
            <section class="panel form-section">
                <h3>基本信息</h3>
                <label>抽奖标题 <input name="title" maxlength="256" required></label>
                <label>抽奖说明 <span class="hint">选填</span>
                    <textarea name="description" maxlength="4096" rows="3"></textarea>
                </label>
            </section>
            <section class="panel form-section">
                <h3>发布位置与报名条件</h3>
                <p class="hint" id="location-guide">每行填一处。机器人会发到所有填写的位置，参加者须全部加入。</p>
                <label>频道 <textarea name="channels" rows="2" placeholder="官方频道 | https://t.me/your_channel" aria-describedby="location-guide private-guide"></textarea></label>
                <label>群组 <textarea name="groups" rows="2" placeholder="交流群 | https://t.me/your_group" aria-describedby="location-guide private-guide"></textarea></label>
                <p id="private-guide" class="hint">私有频道或群组请在链接后加 <code>| -100…</code>，填入对应的聊天编号。至少填写一处。</p>
            </section>
            <section class="panel form-section">
                <h3>开奖条件</h3>
                <label>开奖方式
                    <select name="draw_mode">
                        <option value="time">到指定时间</option>
                        <option value="count">报名满人数</option>
                        <option value="either">到时间或满人数，任一先到</option>
                    </select>
                </label>
                <label id="time-mode-field">时间设置
                    <select name="time_mode">
                        <option value="absolute">选择日期和时间</option>
                        <option value="relative">设定持续时长</option>
                    </select>
                </label>
                <label id="deadline-field">开奖时间 <span id="timezone" class="hint"></span>
                    <input type="datetime-local" name="deadline" required>
                </label>
                <div id="duration-field" class="tier-fields" hidden>
                    <label>持续时长
                        <input type="number" name="duration" inputmode="numeric" min="1" max="1000000" step="1" value="30">
                    </label>
                    <label>单位
                        <select name="duration_unit">
                            <option value="m">分钟</option>
                            <option value="h">小时</option>
                            <option value="d">天</option>
                            <option value="w">周</option>
                        </select>
                    </label>
                </div>
                <label id="target-field" hidden>有效报名人数
                    <input type="number" name="target" inputmode="numeric" min="1" max="1000000000" step="1">
                </label>
            </section>
            <section class="panel form-section">
                <h3>奖项与发奖</h3>
                <label>发奖方式
                    <select name="prize_mode">
                        <option value="none">主办方自行联系</option>
                        <option value="unique">独立码，每人一条</option>
                        <option value="shared">共享文本，中奖者领取同一份</option>
                    </select>
                </label>
                <div id="tier-list" class="tier-list"></div>
                <div class="button-row">
                    <button type="button" class="button secondary" id="add-tier">添加奖项</button>
                    <button type="button" class="button quiet" id="reset-codes" hidden>清空全部奖品内容</button>
                </div>
            </section>
            <p class="form-error" id="create-error" role="alert" tabindex="-1" hidden></p>
            <button type="submit" id="preview-button" class="button primary full">预览抽奖</button>
        </form>
    </template>

    <template id="tier-template">
        <fieldset class="tier">
            <legend>奖项</legend>
            <div class="tier-fields">
                <label>奖项名称 <input name="tier_name" maxlength="64" required></label>
                <label>中奖人数 <input name="tier_count" type="number" value="1" inputmode="numeric" step="1" min="1" max="1000000000" required></label>
            </div>
            <label class="codes-field" hidden><span></span>
                <textarea name="tier_codes" rows="3" spellcheck="false"></textarea>
            </label>
            <div class="tier-footer">
                <span class="hint inventory"></span>
                <button type="button" class="button quiet remove-tier">移除奖项</button>
            </div>
        </fieldset>
    </template>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
        <form method="dialog">
            <h2 id="confirm-title"></h2>
            <p id="confirm-body"></p>
            <div class="button-row dialog-actions">
                <button value="cancel" class="button secondary" autofocus>返回</button>
                <button value="confirm" class="button primary" id="confirm-action">确认</button>
            </div>
        </form>
    </dialog>
</body>
</html>
